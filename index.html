<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Experience</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            /* Container for MindAR */
        }

        #ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>

    <!-- Import Map Removed for Vite -->
</head>

<body>
    <div id="loading">Loading AR...</div>
    <div id="ui-overlay">
        Status: <span id="status">Initializing</span>
    </div>

    <!-- UI Controls -->
    <div
        style="position: fixed; top: 10px; right: 10px; z-index: 1000; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; color: white; font-family: sans-serif;">
        <label for="brightness">Brightness</label><br>
        <input type="range" id="brightness" min="0" max="10" step="0.5" value="5" style="width: 150px;">
    </div>

    <!-- Main Entry Point -->
    <script type="module" src="./js/app.js"></script>
</body>

</html>
